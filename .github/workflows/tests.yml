name: tests

# Runs the CTest suite under AddressSanitizer + UndefinedBehaviorSanitizer.
# This is the guard for the memory-safety / UB bug class (e.g. the triclinic
# cell-list overflow): a violation aborts the test binary with a non-zero exit,
# so the job fails with a pinpointed report instead of silently corrupting data.

on:
  push:
    branches: [master, rework]
  pull_request:

jobs:
  sanitizers:
    name: Sanitized test suite (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # ubuntu-latest (24.04) defaults to gcc-13, which lacks -std=c23
        # (added in gcc-14); install gcc-14 and build with it.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-14 gfortran libgsl-dev libopenblas-dev

      - name: Configure (sanitizers on)
        run: cmake -S src -B build -DSANITIZE=ON -DCMAKE_C_COMPILER=gcc-14

      - name: Build tests
        run: cmake --build build --target t_geometry t_traversal

      - name: Run tests
        env:
          ASAN_OPTIONS: abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
